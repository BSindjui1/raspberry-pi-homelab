<svg width="860" height="520" viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" style="background:#1a1a2e;font-family:Arial,Helvetica,sans-serif;">

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Raspberry Pi container -->
  <rect x="20" y="20" width="580" height="460" rx="16" fill="none" stroke="#374151" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="38" y="46" font-size="13" font-weight="bold" fill="#9ca3af">Raspberry Pi</text>
  <text x="38" y="63" font-size="11" fill="#6b7280">All services running on one device · 24/7</text>

  <!-- PI-HOLE -->
  <rect x="50" y="90" width="200" height="60" rx="8" fill="#085041" stroke="#5dcaa5" stroke-width="0.8"/>
  <text x="150" y="116" font-size="14" font-weight="bold" fill="#9fe1cb" text-anchor="middle">Pi-hole</text>
  <text x="150" y="136" font-size="12" fill="#5dcaa5" text-anchor="middle">DNS · network ad blocking</text>

  <!-- DOCKER STACK -->
  <rect x="350" y="90" width="220" height="60" rx="8" fill="#3c3489" stroke="#afa9ec" stroke-width="0.8"/>
  <text x="460" y="116" font-size="14" font-weight="bold" fill="#cecbf6" text-anchor="middle">Docker stack</text>
  <text x="460" y="136" font-size="12" fill="#afa9ec" text-anchor="middle">Prometheus + Grafana</text>

  <!-- MONITORING SCRIPT -->
  <rect x="160" y="240" width="300" height="60" rx="8" fill="#633806" stroke="#ef9f27" stroke-width="0.8"/>
  <text x="310" y="266" font-size="14" font-weight="bold" fill="#fac775" text-anchor="middle">pi-status-report.sh</text>
  <text x="310" y="286" font-size="12" fill="#ef9f27" text-anchor="middle">CPU · memory · disk · Pi-hole · Docker</text>

  <!-- CRON -->
  <rect x="160" y="390" width="300" height="52" rx="8" fill="#4a1b0c" stroke="#f0997b" stroke-width="0.8"/>
  <text x="310" y="412" font-size="14" font-weight="bold" fill="#f5c4b3" text-anchor="middle">cron scheduler</text>
  <text x="310" y="430" font-size="12" fill="#f0997b" text-anchor="middle">9:30 AM · 10:00 PM daily</text>

  <!-- EMAIL (outside Pi boundary) -->
  <rect x="650" y="240" width="180" height="60" rx="8" fill="#0c447c" stroke="#85b7eb" stroke-width="0.8"/>
  <text x="740" y="266" font-size="14" font-weight="bold" fill="#b5d4f4" text-anchor="middle">Email report</text>
  <text x="740" y="286" font-size="12" fill="#85b7eb" text-anchor="middle">delivered via msmtp</text>

  <!-- Pi-hole → script (DNS stats) -->
  <path d="M150 150 L150 210 L220 210 L220 240" stroke="#5dcaa5" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="155" y="200" font-size="11" fill="#5dcaa5">DNS stats</text>

  <!-- Docker → script (container status) -->
  <path d="M460 150 L460 210 L400 210 L400 240" stroke="#afa9ec" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="408" y="200" font-size="11" fill="#afa9ec">container status</text>

  <!-- Cron → script (triggers) -->
  <line x1="310" y1="390" x2="310" y2="302" stroke="#f0997b" stroke-width="1.2" marker-end="url(#arr-amber)"/>
  <text x="318" y="355" font-size="11" fill="#f0997b">triggers 2x daily</text>

  <!-- Script → email -->
  <line x1="460" y1="270" x2="648" y2="270" stroke="#60a5fa" stroke-width="1.4" marker-end="url(#arr-blue)"/>
  <text x="548" y="262" font-size="11" fill="#60a5fa" text-anchor="middle">sends report</text>

  <!-- Legend -->
  <line x1="20" y1="500" x2="840" y2="500" stroke="#374151" stroke-width="0.8"/>
  <text x="30" y="516" font-size="11" fill="#6b7280">Data flow:</text>
  <line x1="90" y1="511" x2="110" y2="511" stroke="#5dcaa5" stroke-width="1.5"/>
  <text x="116" y="516" font-size="11" fill="#9ca3af">Pi-hole stats</text>
  <line x1="210" y1="511" x2="230" y2="511" stroke="#afa9ec" stroke-width="1.5"/>
  <text x="236" y="516" font-size="11" fill="#9ca3af">Docker status</text>
  <line x1="340" y1="511" x2="360" y2="511" stroke="#f0997b" stroke-width="1.5"/>
  <text x="366" y="516" font-size="11" fill="#9ca3af">Cron trigger</text>
  <line x1="450" y1="511" x2="470" y2="511" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="476" y="516" font-size="11" fill="#9ca3af">Email delivery</text>

</svg>
