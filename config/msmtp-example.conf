# msmtp configuration file
# Location: ~/.msmtprc
# Permissions: chmod 600 ~/.msmtprc  (owner read/write only)
#
# NOTE: This is an example configuration file.
# Replace placeholder values with your own credentials.
# Never commit your real credentials to version control.

defaults
auth           on
tls            on
tls_trust_file /etc/ssl/certs/ca-certificates.crt
logfile        ~/.msmtp.log

account        gmail
host           smtp.gmail.com
port           587
from           your-email@gmail.com        # replace with your Gmail address
user           your-email@gmail.com        # replace with your Gmail address
password       your-app-password-here      # replace with a Gmail App Password
                                           # (NOT your regular Gmail password)
                                           # Generate one at:
                                           # https://myaccount.google.com/apppasswords

# Set gmail as the default account
account default : gmail
